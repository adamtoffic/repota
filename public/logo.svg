<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="repota-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2549B0" />
      <stop offset="52%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#112257" />
    </linearGradient>
    <radialGradient id="repota-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="repota-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="repota-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="repota-fold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <filter id="repota-stack-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#050C22" flood-opacity="0.30" />
    </filter>
    <filter id="repota-card-shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="8" dy="10" stdDeviation="10" flood-color="#091229" flood-opacity="0.26" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#repota-bg)" />
  <circle cx="140" cy="110" r="320" fill="url(#repota-glow)" />

  <g id="repota-artwork" filter="url(#repota-stack-shadow)">
    <g transform="rotate(10.5 267 253)">
      <rect x="172" y="132" width="190" height="242" rx="28" fill="url(#repota-gold)" />
    </g>
    <path
      fill="url(#repota-paper)"
      filter="url(#repota-card-shadow)"
      d="M 160 134 H 282 L 328 180 V 350 A 28 28 0 0 1 300 378 H 160 A 28 28 0 0 1 132 350 V 162 A 28 28 0 0 1 160 134 Z"
    />
    <path
      fill="#1E3A8A"
      opacity="0.09"
      d="M 280 137 V 171 A 12 12 0 0 0 292 183 H 326 Z"
    />
    <path
      fill="url(#repota-fold)"
      d="M 282 134 V 168 A 12 12 0 0 0 294 180 H 328 Z"
    />
    <rect x="162" y="166" width="96" height="22" rx="11" fill="#1E3A8A" />
    <rect x="162" y="200" width="66" height="14" rx="7" fill="#94A3B8" />
    <rect x="162" y="300" width="34" height="46" rx="11" fill="#BFDBFE" />
    <rect x="213" y="274" width="34" height="72" rx="11" fill="#3B82F6" />
    <rect x="264" y="240" width="34" height="106" rx="11" fill="#1E3A8A" />
  </g>
</svg>
