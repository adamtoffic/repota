<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <clipPath id="fav-tile">
      <rect width="512" height="512" rx="96" />
    </clipPath>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2549B0" />
      <stop offset="52%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#112257" />
    </linearGradient>
    <radialGradient id="fav-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.20" />
